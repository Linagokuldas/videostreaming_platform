version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reelflix_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reelflix_db
    ports:
      - "5432:5432"
    volumes:
      - reelflix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reelflix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  reelflix_pgdata:
    driver: local
