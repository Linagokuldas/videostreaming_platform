<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Glowing film-strip reel R symbol -->
  <defs>
    <linearGradient id="reelRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2934" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#E50914" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#redGlow)">
    <!-- Film Reel Ribbon Icon -->
    <path d="M8 8 C8 5 11 3 14 3 H24 C31 3 36 8 36 15 C36 21 31 25 24 25 H18 V45 H10 C8.8 45 8 44.2 8 43 Z" fill="url(#reelRed)" />
    <path d="M18 10 H23 C26.5 10 29 12 29 15 C29 18 26.5 20 23 20 H18 Z" fill="#080808" />
    <path d="M22 23 L34 44 C34.5 45 33.7 46 32.5 46 H25.5 C24.5 46 23.8 45.4 23.3 44.5 L14 26 Z" fill="url(#reelRed)" />
  </g>

  <!-- Wordmark REELFLIX -->
  <text x="44" y="32" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" letter-spacing="2.5" fill="#FFFFFF">
    REEL<tspan fill="#E50914">FLIX</tspan>
  </text>
</svg>
